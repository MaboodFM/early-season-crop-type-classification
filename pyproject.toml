[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-type-classification"
version = "1.1.0"
description = "Field-level crop classification from multi-temporal HLS reflectance"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "lightgbm==4.6.0",
  "python-docx==1.2.0",
  "joblib>=1.4,<2",
  "shap==0.50.0",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
